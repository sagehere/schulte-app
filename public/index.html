<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>专注力训练</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f2ea;
      --paper: #fffdf8;
      --ink: #1f2a2e;
      --muted: #677176;
      --line: #cfd6d2;
      --soft-line: #e6e1d6;
      --accent: #177e89;
      --accent-dark: #0f5c65;
      --accent-soft: #d9f0f2;
      --mark: #db6c43;
      --good: #2f855a;
      --bad: #bf3f34;
      --shadow: 0 18px 50px rgba(55, 48, 37, 0.12);
      --radius: 8px;
      --cell-gap: clamp(4px, 0.7vw, 7px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
    }

    button {
      font: inherit;
    }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 32px;
    }

    .topbar {
      display: grid;
      gap: 14px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--soft-line);
    }

    .title-row {
      display: grid;
      grid-template-columns: auto minmax(220px, 1fr) auto;
      align-items: center;
      gap: 16px;
    }

    .title-task-strip {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      flex-wrap: wrap;
    }

    .title-task-item {
      max-width: min(360px, 100%);
      min-height: 38px;
      display: inline-grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid rgba(219, 108, 67, 0.55);
      border-radius: var(--radius);
      background: #fff4df;
      color: #753512;
      box-shadow: 0 8px 20px rgba(219, 108, 67, 0.18);
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      text-align: left;
      transition: transform 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease;
    }

    .title-task-item:hover {
      transform: translateY(-1px);
      border-color: var(--mark);
      box-shadow: 0 10px 24px rgba(219, 108, 67, 0.26);
    }

    .title-task-item.done {
      border-color: rgba(47, 133, 90, 0.55);
      background: #e7f7e9;
      color: #1b5d3b;
      box-shadow: 0 8px 20px rgba(47, 133, 90, 0.16);
    }

    .title-task-item.notice {
      grid-template-columns: 1fr;
      background: var(--mark);
      border-color: var(--mark);
      color: #ffffff;
      cursor: default;
      box-shadow: 0 10px 28px rgba(219, 108, 67, 0.28);
    }

    .title-task-item.notice.done {
      background: var(--good);
      border-color: var(--good);
      color: #ffffff;
      box-shadow: 0 10px 28px rgba(47, 133, 90, 0.24);
    }

    button.title-task-item.notice {
      cursor: pointer;
    }

    .title-task-main,
    .title-task-count {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.2;
    }

    .title-task-main {
      font-size: 0.88rem;
    }

    .title-task-count {
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
      color: inherit;
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      line-height: 1.15;
      font-weight: 750;
    }

    .training-menu {
      display: grid;
      gap: 10px;
    }

    .menu-row {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
    }

    .mode-row:not(:has(.mode-switch:not(.is-hidden))) {
      display: none;
    }

    .menu-label {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
    }

    .training-switch {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 8px;
      padding: 4px;
      border: 1px solid var(--soft-line);
      border-radius: var(--radius);
      background: #fbf7ee;
    }

    .mode-switch {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-start;
    }

    .training-button,
    .mode-button,
    .tool-button,
    .icon-button {
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      transition: transform 0.14s ease, background 0.14s ease, border-color 0.14s ease, color 0.14s ease;
    }

    .training-button,
    .mode-button {
      min-width: 48px;
      height: 40px;
      padding: 0 12px;
      border-radius: var(--radius);
      font-weight: 700;
    }

    .training-button {
      width: 100%;
    }

    .training-button:hover,
    .mode-button:hover,
    .tool-button:hover,
    .icon-button:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .training-button.active,
    .mode-button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .admin-navigation-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .admin-navigation-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
    }

    .admin-navigation-row.is-dragging {
      opacity: 0.55;
      pointer-events: none;
    }

    .admin-navigation-handle {
      min-width: 36px;
      min-height: 36px;
      padding: 0;
      cursor: grab;
      touch-action: none;
    }

    .admin-navigation-handle:active {
      cursor: grabbing;
    }

    .admin-navigation-visible {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 28px;
      align-items: start;
      padding-top: 24px;
    }

    .practice {
      min-width: 0;
      display: grid;
      gap: 18px;
      justify-items: center;
    }

    .status-strip {
      width: min(100%, 430px);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      min-height: 74px;
      padding: 12px 12px 10px;
      background: var(--paper);
      border: 1px solid var(--soft-line);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(55, 48, 37, 0.05);
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.2;
      white-space: nowrap;
    }

    .metric strong {
      display: block;
      margin-top: 6px;
      font-size: clamp(1.25rem, 2.7vw, 1.72rem);
      line-height: 1.05;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .metric.target strong {
      color: var(--mark);
    }

    .metric.time strong {
      color: var(--accent-dark);
    }

    .board-shell {
      --board-max: 346px;
      --shell-pad: clamp(8px, 2vw, 16px);
      width: min(100%, calc(100vw - 20px), var(--board-max));
      max-width: 100%;
      padding: var(--shell-pad);
      background: var(--paper);
      border: 1px solid var(--soft-line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .board-shell[data-size="3"] {
      --board-max: 246px;
    }

    .board-shell[data-size="4"] {
      --board-max: 296px;
    }

    .board-shell[data-size="5"] {
      --board-max: 346px;
    }

    .board-shell[data-size="6"] {
      --board-max: 396px;
    }

    .board-shell[data-size="7"] {
      --board-max: 446px;
    }

    .board-shell[data-training="stroop"] {
      --board-max: 520px;
    }

    .board-shell[data-training="poem"] {
      --board-max: min(620px, calc(100vw - 20px));
    }

    .board-shell[data-training="decode"] {
      --board-max: 346px;
    }

    .board-shell[data-training="mindfulness"] {
      --board-max: min(520px, calc(100vw - 20px));
    }

    .mindfulness-panel {
      display: grid;
      gap: 14px;
      padding: 18px;
      border: 1px solid var(--soft-line);
      border-radius: var(--radius);
      background: #fbf7ee;
    }

    .mindfulness-panel audio {
      width: 100%;
    }

    .mindfulness-panel p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .board {
      display: grid;
      width: 100%;
      aspect-ratio: 1;
      gap: var(--cell-gap);
    }

    .cell {
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      border: 2px solid #2f393c;
      border-radius: 4px;
      background: #fffaf0;
      color: var(--digit-color, #101719);
      font-weight: 800;
      font-size: clamp(1.05rem, 6vmin, 2.35rem);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      user-select: none;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease, transform 0.12s ease;
    }

    .board[data-size="6"] .cell,
    .board[data-size="7"] .cell {
      font-size: clamp(0.9rem, 5vmin, 1.95rem);
    }

    .board[data-training="poem"] .cell {
      font-size: clamp(1rem, 4.6vmin, 1.9rem);
    }

    .idiom-target {
      margin-bottom: 14px;
      padding: 12px 14px;
      border: 1px solid var(--soft-line);
      border-radius: var(--radius);
      background: #fbf7ee;
      text-align: center;
    }

    .idiom-target span {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.2;
    }

    .idiom-target strong {
      display: block;
      margin-top: 4px;
      font-size: clamp(1.45rem, 5vw, 2.2rem);
      line-height: 1.15;
      letter-spacing: 0.08em;
    }

    .poem-meta {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
    }

    .poem-full {
      margin-top: 14px;
      padding: 14px;
      border: 1px solid var(--soft-line);
      border-radius: var(--radius);
      background: #fbf7ee;
      color: var(--ink);
      font-size: clamp(1rem, 3vw, 1.18rem);
      line-height: 1.9;
      text-align: center;
      white-space: pre-line;
    }

    .cell:hover {
      background: #eef7f8;
      border-color: var(--accent);
    }

    .cell:active {
      transform: scale(0.97);
    }

    .cell.found {
      color: rgba(31, 42, 46, 0.28);
      background: #eef1ec;
      border-color: #b9c4bd;
      cursor: default;
    }

    .board[data-training="schulte"] .cell.found,
    .board[data-training="idiom"] .cell.found,
    .board[data-training="poem"] .cell.found {
      color: var(--digit-color, #101719);
      background: #fffaf0;
      border-color: #2f393c;
      cursor: pointer;
    }

    .cell.hidden-content {
      background: var(--soft-line);
      color: transparent;
      cursor: default;
    }

    .cell.first-target {
      background: var(--accent-soft);
      border: 2px solid var(--accent);
      font-weight: bold;
    }

    .cell.wrong {
      animation: wrongTap 0.3s ease;
      border-color: var(--bad);
      background: #fce7e2;
    }

    .cell.next {
      outline: 3px solid rgba(219, 108, 67, 0.32);
      outline-offset: -6px;
    }

    .cell.memory-correct {
      background: #d8f3df;
      border-color: var(--good);
    }

    .cell.memory-wrong {
      background: #fce7e2;
      border-color: var(--bad);
    }

    .cell.memory-lit {
      background: #2563eb;
      border-color: #1d4ed8;
      box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.2);
    }

    @keyframes wrongTap {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
      75% { transform: translateX(-2px); }
    }

    .stroop-panel {
      width: 100%;
      min-height: 380px;
      display: grid;
      grid-template-rows: auto auto auto;
      gap: clamp(28px, 6vw, 54px);
      align-items: center;
      justify-items: center;
    }

    .stroop-progress {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .stroop-word {
      min-height: 150px;
      display: grid;
      place-items: center;
      font-size: clamp(5rem, 24vw, 9rem);
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0;
    }

    .color-choices {
      width: min(100%, 560px);
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
    }

    .color-choice {
      min-width: 0;
      height: clamp(58px, 11vw, 78px);
      border: 2px solid rgba(31, 42, 46, 0.35);
      border-radius: var(--radius);
      cursor: pointer;
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.28);
      transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
    }

    .color-choice:hover {
      transform: translateY(-2px);
      border-color: var(--ink);
    }

    .color-choice:active {
      transform: scale(0.97);
    }

    .color-choice.wrong {
      animation: wrongTap 0.3s ease;
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.28), 0 0 0 3px rgba(191, 63, 52, 0.42);
    }

    .color-choice.correct {
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.28), 0 0 0 3px rgba(47, 133, 90, 0.38);
    }

    .decode-panel {
      width: 100%;
      display: grid;
      gap: 18px;
    }

    .decode-key,
    .decode-questions,
    .decode-answer-row {
      display: grid;
      gap: 8px;
    }

    .decode-key {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .decode-key-item,
    .decode-question {
      min-width: 0;
      border: 1px solid var(--soft-line);
      border-radius: var(--radius);
      background: #fbf7ee;
    }

    .decode-key-item {
      display: grid;
      gap: 4px;
      justify-items: center;
      padding: 8px 4px;
    }

    .decode-symbol {
      color: var(--ink);
      font-size: clamp(1.45rem, 8vw, 2.25rem);
      line-height: 1;
      font-weight: 850;
    }

    .decode-letter {
      color: var(--accent-dark);
      font-size: 1rem;
      line-height: 1;
      font-weight: 850;
    }

    .decode-questions {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .decode-question {
      min-height: 50px;
      display: grid;
      place-items: center;
      padding: 6px;
      cursor: default;
    }

    .decode-question.current {
      outline: 3px solid rgba(47, 133, 90, 0.42);
      outline-offset: -5px;
      background: #d8f3df;
    }

    .decode-question.answered {
      background: #eef1ec;
    }

    .decode-question.answered .decode-symbol {
      color: rgba(31, 42, 46, 0.28);
    }

    .decode-answer-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .decode-choice {
      min-width: 0;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      font-weight: 800;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease, color 0.12s ease;
    }

    .decode-choice:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .decode-choice.correct {
      background: #d8f3df;
      border-color: var(--good);
      color: #1b5d3b;
    }

    .decode-choice.wrong {
      animation: wrongTap 0.3s ease;
      background: #fce7e2;
      border-color: var(--bad);
      color: var(--bad);
    }

    .is-hidden {
      display: none !important;
    }

    .toolbar {
      width: min(100%, 680px);
      display: grid;
      grid-template-columns: 1fr;
      align-items: stretch;
      gap: 12px;
    }

    .tool-group {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, max-content));
      align-items: center;
      gap: 10px;
      justify-content: center;
    }

    .switch-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
      justify-content: stretch;
      align-items: center;
      gap: 8px;
    }

    .tool-button {
      min-height: 42px;
      padding: 0 16px;
      border-radius: var(--radius);
      font-weight: 700;
    }

    .tool-button.primary {
      background: var(--ink);
      border-color: var(--ink);
      color: #ffffff;
    }

    .global-timer {
      display: grid;
      grid-template-columns: auto minmax(92px, auto) auto auto;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      padding: 4px;
      border: 1px solid var(--soft-line);
      border-radius: var(--radius);
      background: #fbf7ee;
    }

    .global-timer span {
      padding-left: 8px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.1;
      white-space: nowrap;
    }

    .global-timer strong {
      min-width: 92px;
      color: var(--accent-dark);
      font-size: 1.26rem;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .global-timer .tool-button {
      min-height: 34px;
      padding: 0 10px;
      font-size: 0.9rem;
    }

    .global-timer .tool-button:first-of-type {
      background: var(--ink);
      border-color: var(--ink);
      color: #ffffff;
    }

    .switch-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      min-height: 42px;
      padding: 0 10px;
      border: 1px solid var(--soft-line);
      border-radius: var(--radius);
      background: #fbf7ee;
      color: var(--muted);
      font-size: 0.93rem;
      white-space: nowrap;
    }

    .switch-label input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .score-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
    }

    .panel {
      min-width: 0;
      padding: 18px;
      background: var(--paper);
      border: 1px solid var(--soft-line);
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(55, 48, 37, 0.06);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.2;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .summary-item {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--soft-line);
      border-radius: var(--radius);
      background: #fbf7ee;
    }

    .summary-item span {
      display: block;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .summary-item strong {
      display: block;
      margin-top: 4px;
      font-size: 1.15rem;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .record {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--soft-line);
      border-radius: var(--radius);
      background: #fbf7ee;
    }

    .record .mode {
      min-width: 0;
      color: var(--accent-dark);
      font-weight: 800;
    }

    .record time {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.75rem;
      overflow-wrap: anywhere;
    }

    .record .score {
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .empty {
      margin: 0;
      padding: 20px 0;
      color: var(--muted);
      text-align: center;
    }

    .icon-button {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      font-weight: 800;
      line-height: 1;
    }

    .dialog {
      width: min(820px, calc(100% - 24px));
      max-height: min(820px, calc(100vh - 32px));
      padding: 0;
      border: 1px solid var(--soft-line);
      border-radius: var(--radius);
      background: var(--paper);
      color: var(--ink);
      box-shadow: var(--shadow);
    }

    #recordsDialog {
      overflow: hidden;
    }

    .dialog::backdrop {
      background: rgba(31, 42, 46, 0.42);
    }

    .dialog-inner {
      max-height: calc(100vh - 32px);
      padding: 20px;
    }

    #recordsDialog .dialog-inner {
      display: flex;
      flex-direction: column;
      max-height: min(820px, calc(100vh - 32px));
      min-height: 0;
      overflow: hidden;
    }

    #userCenterDialog {
      overflow: hidden;
    }

    #userCenterDialog .dialog-inner {
      display: flex;
      flex-direction: column;
      max-height: min(820px, calc(100vh - 32px));
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
    }

    #userCenterDialog .dialog-inner > .panel-header:first-child {
      position: sticky;
      top: 0;
      z-index: 3;
      margin: 0;
      padding: 0 0 12px;
      background: var(--paper);
      border-bottom: 1px solid var(--soft-line);
    }

    .dialog-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .subsection-header {
      margin-top: 18px;
    }

    .subsection-divider {
      border: none;
      border-top: 1px solid #e6e1d6;
      margin: 14px 0;
    }

    .full-records {
      display: grid;
      align-content: start;
      gap: 8px;
      min-height: 0;
      flex: 1 1 auto;
      max-height: clamp(160px, 34vh, 420px);
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
      scrollbar-gutter: stable;
    }

    .full-records::-webkit-scrollbar {
      width: 8px;
    }

    .full-records::-webkit-scrollbar-track {
      background: #f0eadf;
      border-radius: 999px;
    }

    .full-records::-webkit-scrollbar-thumb {
      background: #b9c4bd;
      border-radius: 999px;
    }

    .full-records::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    .notice {
      min-height: 26px;
      color: var(--good);
      font-weight: 700;
      text-align: center;
    }

    .notice.error {
      color: var(--bad);
    }

    .user-grid,
    .admin-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .tz-row {
      grid-template-columns: 1fr auto;
      align-items: end;
    }
    .tz-row .form-field {
      display: grid;
      gap: 6px;
    }
    .tz-row select {
      width: 100%;
    }

    .user-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: end;
    }
    .user-actions input {
      flex: 1 1 100px;
      min-width: 80px;
    }
    .user-actions .tool-button {
      white-space: nowrap;
    }

    .load-user-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 12px;
    }

    .form-field {
      display: grid;
      gap: 6px;
      min-width: 0;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .form-field input,
    .form-field select,
    .task-input {
      width: 100%;
      min-width: 0;
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fffaf0;
      color: var(--ink);
      font: inherit;
    }

    .profile-meta {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .task-panel {
      display: grid;
      gap: 10px;
    }

    .task-config-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(82px, 1fr));
      gap: 10px;
      align-items: end;
      padding: 10px;
      border: 1px solid var(--soft-line);
      border-radius: var(--radius);
      background: #fbf7ee;
    }

    .daily-task-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1.25fr) minmax(78px, 0.35fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--soft-line);
      border-radius: var(--radius);
      background: #fbf7ee;
    }

    .daily-task-row input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
    }

    .daily-task-row.done .task-input {
      color: var(--muted);
      text-decoration: line-through;
    }

    .daily-score-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .daily-score-list {
      display: grid;
      gap: 8px;
      max-height: 260px;
      overflow: auto;
      padding-right: 4px;
    }

    .score-rating {
      color: var(--mark);
      font-weight: 800;
    }

    .admin-trigger-title {
      cursor: default;
      user-select: none;
    }

    @media (max-width: 920px) {
      .title-row {
        grid-template-columns: 1fr;
        align-items: stretch;
      }

      .title-task-strip {
        width: 100%;
      }

      .global-timer {
        width: 100%;
        grid-template-columns: auto minmax(92px, 1fr) auto auto;
      }

      .workspace {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .score-panel {
        grid-template-columns: 1fr;
      }

      .dialog {
        width: min(760px, calc(100% - 20px));
      }
    }

    @media (max-width: 680px) {
      .app {
        width: min(100% - 16px, 1180px);
        padding-top: 14px;
      }

      .topbar {
        gap: 12px;
      }

      .training-switch,
      .global-timer {
        width: 100%;
      }

      .menu-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }

      .menu-label {
        padding-left: 2px;
      }

      .training-switch {
        grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
      }

      .training-button {
        width: 100%;
      }

      .mode-switch {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(58px, 1fr));
        justify-content: flex-start;
        gap: 6px;
      }

      .mode-button {
        min-width: 0;
        width: 100%;
        height: 38px;
        padding: 0 4px;
        font-size: 0.92rem;
      }

      .metric {
        min-height: 66px;
        padding: 10px;
      }

      .status-strip {
        width: min(100%, 390px);
        gap: 8px;
      }

      .practice {
        gap: 14px;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .tool-group,
      .switch-group,
      .tool-button {
        width: 100%;
      }

      .tool-group {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .switch-group {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        justify-content: stretch;
        gap: 8px;
      }

      .global-timer {
        display: grid;
        grid-template-columns: minmax(72px, 1fr) auto auto auto;
      }

      .global-timer .tool-button {
        width: auto;
      }

      .switch-label {
        justify-content: center;
      }

      .record {
        grid-template-columns: 54px minmax(0, 1fr);
      }

      .record .score {
        grid-column: 2;
      }

      .dialog {
        width: calc(100% - 16px);
        max-height: calc(100dvh - 16px);
      }

      .dialog-inner {
        max-height: calc(100dvh - 16px);
        padding: 14px;
      }

      #recordsDialog .dialog-inner {
        max-height: calc(100dvh - 16px);
      }

      .panel {
        padding: 14px;
      }

      .full-records {
        max-height: clamp(140px, 30dvh, 300px);
      }

      .decode-key {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .decode-questions {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .dialog-actions .tool-button {
        width: auto;
      }
    }

    @media (max-width: 420px) {
      .app {
        width: min(100% - 12px, 1180px);
      }

      .workspace {
        padding-top: 16px;
      }

      .board-shell {
        width: min(100%, calc(100vw - 12px), var(--board-max));
      }

      .status-strip {
        gap: 6px;
      }

      .metric strong {
        font-size: 1.18rem;
      }

      .metric span {
        font-size: 0.72rem;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }

      .tool-group {
        grid-template-columns: 1fr;
      }

      .switch-group {
        grid-template-columns: 1fr;
      }

      .global-timer {
        grid-template-columns: 1fr 1fr;
      }

      .global-timer span,
      .global-timer strong {
        grid-column: 1 / -1;
      }

      .global-timer .tool-button {
        width: 100%;
      }

      .decode-key,
      .decode-questions,
      .decode-answer-row {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .dialog {
        width: calc(100% - 10px);
        max-height: calc(100dvh - 10px);
      }

      .dialog-inner {
        max-height: calc(100dvh - 10px);
        padding: 10px;
      }

      #recordsDialog .dialog-inner {
        max-height: calc(100dvh - 10px);
      }

      .panel-header {
        align-items: flex-start;
      }

      .record {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .record .mode,
      .record .score {
        grid-column: auto;
      }

      .record > div:nth-child(2) {
        grid-column: 1 / -1;
      }

      .record time {
        font-size: 0.72rem;
      }

      .dialog-actions {
        justify-content: stretch;
      }

      .dialog-actions .tool-button {
        width: 100%;
      }

      .admin-grid .dialog-actions {
        grid-template-columns: 1fr;
      }

      .user-actions {
        flex-direction: column;
      }
      .user-actions input {
        flex: none;
        width: auto;
      }
      .user-actions .tool-button {
        width: 100%;
      }

      .training-switch {
        grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
      }

      .user-grid .form-field,
      .admin-grid .form-field {
        grid-template-columns: 1fr;
      }

      .user-grid,
      .admin-grid,
      .load-user-row,
      .task-config-grid,
      .daily-task-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title-row">
        <h1 id="appTitle" class="admin-trigger-title">专注力训练</h1>
        <div class="title-task-strip" id="titleTaskStrip" aria-live="polite"></div>
        <div class="global-timer" aria-label="训练计时">
          <span>训练时长</span>
          <strong id="sessionTimeText">00:00:00</strong>
          <button class="tool-button" type="button" id="sessionStartButton">开始计时</button>
          <button class="tool-button" type="button" id="sessionStopButton" disabled>结束计时</button>
        </div>
      </div>
      <div class="training-menu" aria-label="训练菜单">
        <div class="menu-row">
          <span class="menu-label">训练模块</span>
          <nav class="training-switch" id="trainingSwitch" aria-label="训练模式">
            <button class="training-button active" type="button" data-training="schulte">舒尔特方格</button>
            <button class="training-button" type="button" data-training="stroop">斯特鲁普</button>
            <button class="training-button" type="button" data-training="idiom">成语训练</button>
            <button class="training-button" type="button" data-training="poem">古诗训练</button>
            <button class="training-button" type="button" data-training="memory">记忆训练</button>
            <button class="training-button" type="button" data-training="decode">译码训练</button>
            <button class="training-button" type="button" data-training="mindfulness">正念练习</button>
          </nav>
        </div>
        <div class="menu-row mode-row">
          <span class="menu-label">从属模式</span>
          <nav class="mode-switch" id="sizeSwitch" aria-label="方格模式">
            <button class="mode-button" type="button" data-size="3">3×3</button>
            <button class="mode-button" type="button" data-size="4">4×4</button>
            <button class="mode-button active" type="button" data-size="5">5×5</button>
            <button class="mode-button" type="button" data-size="6">6×6</button>
            <button class="mode-button" type="button" data-size="7">7×7</button>
          </nav>
          <nav class="mode-switch is-hidden" id="idiomSizeSwitch" aria-label="成语方格模式">
            <button class="mode-button active" type="button" data-idiom-cols="4">4×4</button>
            <button class="mode-button" type="button" data-idiom-cols="5">4×5</button>
            <button class="mode-button" type="button" data-idiom-cols="6">4×6</button>
            <button class="mode-button" type="button" data-idiom-cols="7">4×7</button>
          </nav>
        </div>
      </div>
    </header>

    <section class="workspace" aria-label="训练工作区\">
      <div class="practice">
        <section class="status-strip" aria-label="当前训练状态\">
          <div class="metric time">
            <span>用时</span>
            <strong id="timeText">0.00</strong>
          </div>
          <div class="metric target">
            <span id="targetLabel">下一个数字</span>
            <strong id="targetText">1</strong>
          </div>
          <div class="metric">
            <span>错误</span>
            <strong id="errorText">0</strong>
          </div>
        </section>

        <section class="board-shell" id="boardShell" data-size="5" aria-label="舒尔特方格\">
          <div class="idiom-target is-hidden" id="idiomTarget">
            <span>目标成语</span>
            <strong id="idiomText">安居乐业</strong>
            <small class="poem-meta is-hidden" id="poemMeta"></small>
          </div>
          <div class="board" id="board" data-size="5"></div>
          <div class="poem-full is-hidden" id="poemFullText"></div>
          <div class="stroop-panel is-hidden" id="stroopPanel" aria-label="斯特鲁普效应训练">
            <div class="stroop-progress" id="stroopProgress">1 / 25</div>
            <div class="stroop-word" id="stroopWord">字</div>
            <div class="color-choices" id="colorChoices"></div>
          </div>
          <div class="decode-panel is-hidden" id="decodePanel" aria-label="译码训练">
            <div class="decode-key" id="decodeKey"></div>
            <div class="decode-questions" id="decodeQuestions"></div>
            <div class="decode-answer-row" id="decodeAnswerPad"></div>
          </div>
          <div class="mindfulness-panel is-hidden" id="mindfulnessPanel" aria-label="正念练习">
            <label class="form-field">引导音频<select id="mindfulnessAudioSelect" disabled><option value="">正在加载音频...</option></select></label>
            <audio id="mindfulnessAudio" controls preload="metadata"></audio>
            <p id="mindfulnessAudioHint" aria-live="polite">选择引导音频后开始练习。</p>
          </div>
        </section>

        <div class="toolbar">
          <div class="tool-group">
            <button class="tool-button primary" type="button" id="resetButton">重置方格</button>
            <button class="tool-button primary is-hidden" type="button" id="memoryStartButton">开始记忆</button>
            <button class="tool-button is-hidden" type="button" id="memoryReplayButton" disabled>复现</button>
            <button class="tool-button is-hidden" type="button" id="poemToggleButton" aria-expanded="false">显示全诗</button>
            <button class="tool-button primary is-hidden" type="button" id="mindfulnessFinishButton" disabled>结束并记录</button>
            <button class="tool-button" type="button" id="recordsButton">成绩面板</button>
            <button class="tool-button" type="button" id="userCenterButton">用户中心</button>
          </div>
          <div class="switch-group" aria-label="训练开关\">
            <label class="switch-label" id="hintWrap">
              <input type="checkbox" id="hintToggle">
              <span>高亮下一个</span>
            </label>
            <label class="switch-label" id="reverseOrderWrap">
              <input type="checkbox" id="reverseOrderToggle">
              <span>倒序</span>
            </label>
            <label class="switch-label" id="colorInterferenceWrap">
              <input type="checkbox" id="colorInterferenceToggle">
              <span>颜色干扰</span>
            </label>
            <label class="switch-label is-hidden" id="decodeReverseWrap">
              <input type="checkbox" id="decodeReverseToggle">
              <span>&#20498;&#35793;</span>
            </label>
            <label class="switch-label is-hidden" id="stroopTextAnswerWrap">
              <input type="checkbox" id="stroopTextAnswerToggle">
              <span>&#31572;&#25991;&#23383;&#31034;&#24847;</span>
            </label>
          </div>
        </div>
        <div class="notice" id="notice" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <dialog class="dialog" id="resultDialog">
    <div class="dialog-inner">
      <div class="panel-header">
        <h2>完成本轮训练</h2>
        <button class="icon-button" type="button" id="closeResultButton" aria-label="关闭">×</button>
      </div>
      <div class="summary-grid" id="resultSummary"></div>
      <div class="dialog-actions">
        <button class="tool-button primary" type="button" id="againButton">再练一次</button>
      </div>
    </div>
  </dialog>

  <dialog class="dialog" id="recordsDialog">
    <div class="dialog-inner">
      <div class="panel-header">
        <h2>成绩面板</h2>
        <button class="icon-button" type="button" id="closeRecordsButton" aria-label="关闭">×</button>
      </div>
      <div class="score-panel">
        <section class="panel">
          <div class="panel-header">
            <h2>成绩概览</h2>
          </div>
          <div class="summary-grid">
            <div class="summary-item">
              <span id="countLabel">练习次数</span>
              <strong id="countText">0</strong>
            </div>
            <div class="summary-item">
              <span id="avgLabel">平均用时</span>
              <strong id="avgText">--</strong>
            </div>
            <div class="summary-item">
              <span id="fastLabel">最快用时</span>
              <strong id="fastText">--</strong>
            </div>
            <div class="summary-item">
              <span id="avgErrorLabel">平均错误</span>
              <strong id="avgErrorText">--</strong>
            </div>
          </div>
        </section>

      </div>
      <div class="panel-header subsection-header">
        <h2>全部成绩记录</h2>
        <button class="icon-button" type="button" id="clearAllButton" aria-label="清空全部记录">×</button>
      </div>
      <div class="full-records" id="fullRecords"></div>
      <div class="notice" id="recordsNotice" aria-live="polite"></div>
      <div class="dialog-actions">
        <button class="tool-button" type="button" id="closeRecordsBottomButton">关闭</button>
      </div>
    </div>
  </dialog>

  <dialog class="dialog" id="userCenterDialog">
    <div class="dialog-inner">
      <div class="panel-header">
        <h2>用户中心</h2>
        <button class="icon-button" type="button" id="closeUserCenterButton" aria-label="关闭">×</button>
      </div>
      <section class="panel task-panel">
        <div class="panel-header">
          <h2>用户资料</h2>
          <div class="dialog-actions"><button class="tool-button" type="button" id="registerUserButton">注册用户</button><button class="tool-button" type="button" id="logoutUserButton">登出</button><button class="tool-button primary" type="button" id="saveUserButton">保存修改</button></div>
        </div>
        <div class="user-grid" id="userProfileFields">
          <label class="form-field">用户名：<input id="usernameInput" type="text" maxlength="24" autocomplete="name"></label>
          <label class="form-field">识别码：<input id="identifierInput" type="text" maxlength="32" autocomplete="off" inputmode="latin" pattern="[A-Za-z0-9]+"></label>
          <label class="form-field">出生日期<input id="birthDateInput" type="date"></label>
        </div>
        <div class="load-user-row">
          <label class="form-field">识别码：<input id="loadIdentifierInput" type="text" maxlength="32" autocomplete="off" inputmode="latin" pattern="[A-Za-z0-9]+"></label>
          <label class="form-field">密码：<input id="loginPasswordInput" type="password" autocomplete="current-password"></label>
          <button class="tool-button primary" type="button" id="loginUserButton">登录并同步数据</button>
        </div>
        <div class="profile-meta" id="userStatusText">未创建用户时，网页训练与本地成绩仍可正常使用。</div>
        <div class="notice" id="userCenterNotice" aria-live="polite"></div>
      </section>
      <section class="panel task-panel subsection-header">
        <div class="panel-header">
          <h2>每日任务设置</h2>
          <span class="profile-meta" id="taskDateText"></span>
        </div>
        <div class="task-config-grid">
          <label class="form-field">模块
            <select id="taskModuleSelect">
              <option value="schulte">舒尔特方格</option>
              <option value="stroop">斯特鲁普</option>
              <option value="idiom">成语训练</option>
              <option value="poem">古诗训练</option>
              <option value="memory">记忆训练</option>
              <option value="decode">译码训练</option>
              <option value="mindfulness">正念练习</option>
            </select>
          </label>
          <label class="form-field" id="taskSizeWrap">规格
            <select id="taskSizeSelect">
              <option value="3">3×3</option>
              <option value="4">4×4</option>
              <option value="5" selected>5×5</option>
              <option value="6">6×6</option>
              <option value="7">7×7</option>
            </select>
          </label>
          <label class="form-field" id="taskReverseWrap">顺序
            <select id="taskReverseSelect">
              <option value="false">正序</option>
              <option value="true">倒序</option>
            </select>
          </label>
          <label class="form-field" id="taskColorWrap">颜色干扰
            <select id="taskColorSelect">
              <option value="false">关</option>
              <option value="true">开</option>
            </select>
          </label>
          <label class="form-field" id="taskIdiomWrap">成语数量
            <select id="taskIdiomSelect">
              <option value="4">4×4</option>
              <option value="5">4×5</option>
              <option value="6">4×6</option>
              <option value="7">4×7</option>
            </select>
          </label>
          <label class="form-field" id="taskStroopAnswerWrap">答题规则
            <select id="taskStroopAnswerSelect">
              <option value="false">按字色作答</option>
              <option value="true">按文字作答</option>

      function mergeSyncedRecords(nextRecords) {
        if (!Array.isArray(nextRecords) || !nextRecords.length) return 0;
        const recordKey = (record) => record.id || [record.type || "schulte", record.date, record.timeMs, record.errors].join(":");
        const seen = new Set(records.map(recordKey));
        let added = 0;
        nextRecords.forEach((record) => {
          const key = recordKey(record);
          if (seen.has(key)) return;
          seen.add(key);
          records.push(record);
          added += 1;
        });
        if (added) {
          records.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
          saveRecords();
          refreshScorePanel();
        }
        return added;
      }

      function todayKey(timeZone) {
        const tz = timeZone || appSettings.timezone;
        if (tz) {
          const parts = new Intl.DateTimeFormat("en-CA", {
            timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit"
          }).formatToParts(new Date());
          const value = Object.fromEntries(parts.map((p) => [p.type, p.value]));
          return `${value.year}-${value.month}-${value.day}`;
        }
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
      }

      function calculateAge(birthDate, atDate = new Date()) {
        if (!birthDate) return null;
        const born = new Date(`${birthDate}T00:00:00`);
        if (Number.isNaN(born.getTime()) || born > atDate) return null;
        let age = atDate.getFullYear() - born.getFullYear();
        const monthDelta = atDate.getMonth() - born.getMonth();
        if (monthDelta < 0 || (monthDelta === 0 && atDate.getDate() < born.getDate())) age -= 1;
        return age >= 0 ? age : null;
      }

      function ageBucket(age) {
        const value = Number(age);
        if (!value || value >= 17) return "adult";
        if (value <= 6) return "child";
        if (value <= 8) return "olderChild";
        if (value <= 11) return "preTeen";
        return "teen";
      }

      function scoreSchulteRecord(record, birthDate) {
        if ((record.type || "schulte") !== "schulte") return "";
        const age = calculateAge(birthDate, record.date ? new Date(record.date) : new Date());
        if (age === null) return "需填写出生日期";
        const sizeValue = Number(record.size || 0);
        const rules = scoreRules[sizeValue];
        if (!rules) return "暂无对应评分标准";
        const seconds = Number(record.timeMs || 0) / 1000;
        const rule = rules[ageBucket(age)] || rules.adult;
        if (seconds < rule.excellent) return "优秀";
        if (seconds < rule.good) return "良好";
        if (seconds < rule.middle) return "中等";
        return "需努力";
      }

      function normalizeTrainingNavigation(navigation) {
        const expectedIds = new Set(defaultTrainingNavigation.map((item) => item.id));
        if (!Array.isArray(navigation) || navigation.length !== defaultTrainingNavigation.length) {
          return defaultTrainingNavigation.map((item) => ({ ...item }));
        }
        const ids = new Set();
        const normalized = [];
        for (const item of navigation) {
          if (!item || !expectedIds.has(item.id) || ids.has(item.id) || typeof item.visible !== "boolean") {
            return defaultTrainingNavigation.map((entry) => ({ ...entry }));
          }
          ids.add(item.id);
          normalized.push({ id: item.id, visible: item.visible });
        }
        return normalized.some((item) => item.visible) ? normalized : defaultTrainingNavigation.map((item) => ({ ...item }));
      }

        }

          handle.setAttribute("aria-label", `调整${labels.get(item.id)}顺序`);
          handle.addEventListener("pointerdown", (event) => {
            if (event.button !== 0) return;
            event.preventDefault();
            adminNavigationDrag = { row, handle, pointerId: event.pointerId };
            handle.setPointerCapture(event.pointerId);
            row.classList.add("is-dragging");
          });
          handle.addEventListener("keydown", (event) => {
            if (event.key === "ArrowUp") moveAdminNavigationRow(row, -1);
            else if (event.key === "ArrowDown") moveAdminNavigationRow(row, 1);
            else return;
            event.preventDefault();
          });
          const label = document.createElement("span");
          label.textContent = labels.get(item.id);
          const visible = document.createElement("label");
          visible.className = "admin-navigation-visible";
          const checkbox = document.createElement("input");

          row.append(handle, label, visible);
          adminTrainingNavigationList.append(row);

      async function apiJson(path, options = {}) {
        let response;
        try {
          response = await fetch(path, {
            ...options,
            headers: {
              "content-type": "application/json",
              ...(options.headers || {})
            }
          });
        } catch (error) {
          throw new Error(`网络请求失败${error.message || "无法连接 Worker API"}`);
        }
        const raw = await response.text();
        let payload = {};
        try {
          payload = raw ? JSON.parse(raw) : {};
        } catch {
          payload = { error: raw.slice(0, 160) };
        }
        if (!response.ok || payload.ok === false) {
          throw new Error(payload.error || `请求失败：HTTP ${response.status}`);
        }
        return payload;
      }

      function readTaskControl(control) {
        const raw = control.input.value;
        if (control.type === "number") return Number(raw);
        if (control.type === "boolean") return raw === "true";
        return raw;
      }

      function modeValue(value, control) {
        const fallback = control.defaultValue;
        if (control.type === "number") return Number(value ?? fallback);
        if (control.type === "boolean") return Boolean(value ?? fallback);
        return value ?? fallback ?? "";
      }

      function buildTaskMode(module) {
        const spec = dailyTaskSpecs[module];
        const mode = { type: module };
        if (!spec) return mode;
        spec.controls.forEach((control) => {
          mode[control.key] = readTaskControl(control);
        });
        return mode;
      }

      function buildTaskFromControls() {
        const module = taskModuleSelect.value;
        const targetCount = Math.min(50, Math.max(1, Math.round(Number(taskCountInput.value || 1)) || 1));
        return {
          id: crypto.randomUUID ? crypto.randomUUID() : `task-${Date.now()}-${Math.random().toString(16).slice(2)}`,
          module,
          mode: buildTaskMode(module),
          targetCount,
          completed: false
        };
      }

      function taskModuleLabel(module) {
        return dailyTaskSpecs[module]?.label || "训练";
      }

      function describeTask(task) {
        const spec = dailyTaskSpecs[task.module];
        return spec ? spec.describe(task.mode || {}) : "标准模式";
      }

      function taskModeSetting(task, key) {
        const spec = dailyTaskSpecs[task.module];
        const control = spec?.controls.find((item) => item.key === key);
        return control ? modeValue((task.mode || {})[key], control) : (task.mode || {})[key];
      }

      function recordMatchesTask(record, task) {
        const type = record.type || "schulte";
        const spec = dailyTaskSpecs[task.module];
        if (type !== task.module || !spec) return false;
        return spec.controls.every((control) => {
          const expected = modeValue((task.mode || {})[control.key], control);
          const actual = modeValue(record[control.key], control);
          return actual === expected;
        });
      }

      function recordsForDate(date) {
        return records.filter((record) => (record.date || "").slice(0, 10) === date);
      }

      function taskTargetCount(task) {
        return Math.min(50, Math.max(1, Math.round(Number(task.targetCount || 1)) || 1));
      }

      function taskProgress(task, date = todayKey()) {
        const target = taskTargetCount(task);
        const matched = recordsForDate(date).filter((record) => recordMatchesTask(record, task)).length;
        const count = Math.min(matched, target);
        return { matched, count, target, done: count >= target };
      }

        button.type = "button";
        button.title = "第" + (nextIndex + 1) + " 项：" + taskModuleLabel(task.module) + " · " + describeTask(task) + "：" + progress.count + "/" + progress.target;
        const main = document.createElement("span");
        main.className = "title-task-main";
        main.textContent = "第" + (nextIndex + 1) + "项 · " + taskModuleLabel(task.module) + " · " + describeTask(task);
        const count = document.createElement("span");
        count.className = "title-task-count";
        count.textContent = progress.count + "/" + progress.target;
        button.append(main, count);
        button.addEventListener("click", () => activateTask(task));

      function formatSeconds(ms) {
        return (ms / 1000).toFixed(2);
      }

      function formatDuration(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        return [hours, minutes, seconds].map((value) => String(value).padStart(2, "0")).join(":");
      }

      function recordPracticeMs(record) {
        return Math.max(0, Math.round(Number(record && (record.practiceMs || record.timeMs) || 0)));
      }

      function formatPracticeDuration(ms) {
        const totalSeconds = Math.round(Number(ms || 0) / 1000);
        if (totalSeconds < 60) return `${totalSeconds} 秒`;
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return seconds ? `${minutes} 分${seconds} 秒` : `${minutes} 分钟`;
      }

      function dailyPracticeMs(date) {
        return recordsForDate(date).reduce((sum, record) => sum + recordPracticeMs(record), 0);
      }

      function formatShortDate(iso) {
        const date = new Date(iso);
        if (Number.isNaN(date.getTime())) return "";
        const tz = appSettings.timezone;
        return date.toLocaleString("zh-CN", {
          timeZone: tz,
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        });
      }

      function shuffle(values) {
        const copy = [...values];
        for (let index = copy.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
        }
        return copy;
      }

      function parsePoems(text) {
        return text
          .split("###***")
          .map((block) => block.split(/\r?\n/).map((line) => line.trim()).filter(Boolean))
          .filter((lines) => lines.length >= 3)
          .map((lines) => {
            const [title, authorLine, ...bodyLines] = lines;
            const [dynasty = "", ...authorParts] = authorLine.split(/\s+/);
            const body = bodyLines.join("\
");
            const chars = [...body.replace(/[，。！？；：?.!?;:\s《》（?)“”"‘?·]/g, "")];
            const lineLengths = bodyLines
              .map((line) => [...line.replace(/[，。！？；：?.!?;:\s《》（?)“”"‘?·]/g, "")].length)
              .filter((length) => length > 0);
            const meter = lineLengths.find((length) => length === 5 || length === 7) || 0;
            return {
              title,
              dynasty,
              author: authorParts.join(" ") || "佚名",
              body,
              chars,
              meter
            };
          })
          .filter((poem) => poem.chars.length > 0);
      }

        const previousId = mindfulnessAudioSelect.value;
        try {
          const payload = await apiJson("/api/audio-guides");
          mindfulnessAudios = Array.isArray(payload.audios) ? payload.audios : [];
          renderMindfulnessAudioOptions(previousId);
        } catch (error) {
          mindfulnessAudios = [];
          renderMindfulnessAudioOptions("");
          mindfulnessAudioHint.textContent = `音频加载失败${error.message}`;
        }
      }

      function renderMindfulnessAudioOptions(previousId = "") {
        mindfulnessAudioSelect.replaceChildren();
        if (!mindfulnessAudios.length) {
          mindfulnessAudioSelect.append(new Option("暂无可用引导音频", ""));
          mindfulnessAudioSelect.disabled = true;
          mindfulnessAudio.removeAttribute("src");
          mindfulnessAudio.load();
          mindfulnessAudio.dataset.audioId = "";
          mindfulnessAudioHint.textContent = "暂无引导音频，请联系管理员上传 MP3。";
          if (currentTraining === "mindfulness") targetText.textContent = "暂无音频";
          return;
        }
        mindfulnessAudios.forEach((audio) => mindfulnessAudioSelect.append(new Option(audio.name, audio.id)));
        mindfulnessAudioSelect.value = mindfulnessAudios.some((audio) => audio.id === previousId) ? previousId : mindfulnessAudios[0].id;
        mindfulnessAudioSelect.disabled = false;
        setMindfulnessAudioSource();
      }

      function selectedMindfulnessAudio() {
        return mindfulnessAudios.find((audio) => audio.id === mindfulnessAudioSelect.value) || null;
      }

      function setMindfulnessAudioSource() {
        const audio = selectedMindfulnessAudio();
        if (!audio) return;
        if (mindfulnessAudio.dataset.audioId !== audio.id) {
          mindfulnessAudio.pause();
          mindfulnessAudio.src = audio.url;
          mindfulnessAudio.dataset.audioId = audio.id;
          mindfulnessAudio.load();
        }
        if (currentTraining === "mindfulness") targetText.textContent = audio.name;
        mindfulnessAudioHint.textContent = "播放时开始计时；暂停不计时，播完会自动记录。";

          previousPair = pair;

      function startMemoryTraining() {

        if (!started) startTimer();

      function addMemoryTarget() {
        const used = new Set(memoryTargets);
        const candidates = Array.from({ length: memorySize * memorySize }, (_, index) => index)
          .filter((index) => !used.has(index));
        const nextTarget = candidates[Math.floor(Math.random() * candidates.length)];
        memoryTargets.push(nextTarget);
      }

      function updateMemoryReplayButton() {
        memoryReplayButton.disabled = currentTraining !== "memory" || !memoryActive || finished || memoryPreviewing || !memoryTargets.length;
      }

      function showMemoryPreview() {
        if (!memoryActive || finished) return;
        window.clearTimeout(memoryPreviewTimer);
        memoryPreviewing = true;
        updateMemoryReplayButton();
        memoryRemaining = new Set(memoryTargets);
        targetText.textContent = `${memoryRound}/${memoryTotalRounds}`;
        notice.textContent = "记住蓝色方格";
        board.querySelectorAll(".cell").forEach((cell) => {
          cell.classList.remove("memory-correct", "memory-wrong");
          cell.classList.toggle("memory-lit", memoryTargets.includes(Number(cell.dataset.index)));
        });

        memoryPreviewTimer = window.setTimeout(() => {
          memoryPreviewing = false;
          board.querySelectorAll(".memory-lit").forEach((cell) => cell.classList.remove("memory-lit"));
          notice.textContent = "请点击刚刚点亮的方格";
          updateMemoryReplayButton();
        }, memoryPreviewMs);
      }

      function replayMemoryPreview() {
        if (currentTraining !== "memory" || !memoryActive || finished || memoryPreviewing || !memoryTargets.length) return;
        memoryReplayCount += 1;
        window.clearTimeout(memoryPreviewTimer);
        memoryPreviewing = true;
        updateMemoryReplayButton();
        notice.textContent = "复现蓝色方格";
        board.querySelectorAll(".cell").forEach((cell) => {
          cell.classList.toggle("memory-lit", memoryTargets.includes(Number(cell.dataset.index)));

        memoryPreviewTimer = window.setTimeout(() => {
          memoryPreviewing = false;
          board.querySelectorAll(".memory-lit").forEach((cell) => cell.classList.remove("memory-lit"));
          notice.textContent = "请点击刚刚点亮的方格";
          updateMemoryReplayButton();
        }, memoryPreviewMs);
      }

      function selectUniqueIdioms(count) {
        for (let attempt = 0; attempt < 300; attempt += 1) {
          const used = new Set();
          const picked = [];
          for (const idiom of shuffle(idiomList)) {
            const chars = [...idiom];
            if (new Set(chars).size !== chars.length) continue;
            if (chars.some((char) => used.has(char))) continue;
            picked.push(idiom);
            chars.forEach((char) => used.add(char));
            if (picked.length === count) return picked;
          }
        }
        throw new Error("无法抽取足够数量且无重复字的成语");
      }

        colorChoices.dataset.cols = String(stroopColors.length);
        colorChoices.dataset.rows = "1";

          button.type = "button";
          button.className = "color-choice";
          button.style.backgroundColor = color.value;
          button.dataset.color = color.key;
          button.setAttribute("aria-label", color.name);
          button.title = color.name;

          colorChoices.append(button);
