      function nextStroopPrompt() {
        const answerOptions = stroopColors.filter((color) => color.key !== previousStroopColorKey);
        const answerColor = answerOptions[Math.floor(Math.random() * answerOptions.length)];
        const distractorOptions = stroopColors.filter((color) => color.key !== answerColor.key);
        const distractorColor = distractorOptions[Math.floor(Math.random() * distractorOptions.length)];
        const targetColor = stroopTextAnswerOn ? distractorColor : answerColor;
        const wordColor = stroopTextAnswerOn ? answerColor : distractorColor;
        currentStroopColor = targetColor;
        currentStroopAnswerColor = answerColor;
        previousStroopColorKey = answerColor.key;
        stroopWord.textContent = wordColor.name;
        stroopWord.style.color = targetColor.value;
        stroopProgress.textContent = `${stroopTrial} / ${stroopTotal}`;
        targetText.textContent = `${stroopTrial}/${stroopTotal}`;
        renderColorChoices();
      }

      function renderDecodeAnswerPad() {
        decodeAnswerPad.replaceChildren();
        decodeAnswerOptions.forEach((value) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "decode-choice";
          button.textContent = value;
          button.dataset.answer = value;
          button.addEventListener("click", () => handleDecodeChoice(button));
          decodeAnswerPad.append(button);
        });
      }

      function refreshDecodeCursor() {
        decodeQuestions.querySelectorAll(".decode-question").forEach((item, index) => {
          item.classList.toggle("current", index === decodeAnswered && !finished);
        });
      }

      function startTimer() {
        if (timerId) return;
        startSessionTimer();
        started = true;
        startStamp = performance.now() - elapsedMs;
        timerId = window.setInterval(() => {
          elapsedMs = performance.now() - startStamp;
          timeText.textContent = formatSeconds(elapsedMs);
        }, 40);
      }

      function stopTimer() {
        stopSessionTimer();
        if (timerId) {
          window.clearInterval(timerId);
          timerId = 0;
        }
      }

      function pauseTimer() {
        if (timerId) elapsedMs = performance.now() - startStamp;
        stopTimer();
        timeText.textContent = formatSeconds(elapsedMs);
      }

      function refreshSessionTimer() {
        if (sessionStarted) sessionElapsedMs = performance.now() - sessionStartStamp;
        sessionTimeText.textContent = formatDuration(sessionElapsedMs);
      }

      function startSessionTimer() {
        if (sessionStarted) return;
        sessionStarted = true;
        sessionStartStamp = performance.now() - sessionElapsedMs;
        sessionStartButton.disabled = true;
        sessionStopButton.disabled = false;
        refreshSessionTimer();
        sessionTimerId = window.setInterval(refreshSessionTimer, 250);
      }

      function stopSessionTimer() {
        if (!sessionStarted) return Math.round(sessionElapsedMs);
        refreshSessionTimer();
        sessionStarted = false;
        if (sessionTimerId) {
          window.clearInterval(sessionTimerId);
          sessionTimerId = 0;
        }
        sessionStartButton.disabled = false;
        sessionStopButton.disabled = true;
        return Math.round(sessionElapsedMs);
      }

      function revealAllCells() {
        board.querySelectorAll(".hidden-content").forEach(cell => {
          cell.textContent = cell.dataset.value || cell.dataset.char || "";
          cell.classList.remove("hidden-content");
        });
        board.querySelectorAll(".first-target").forEach(cell => {
          cell.classList.remove("first-target");
        });
      }

      function handleCell(cell, value) {
        if (finished || cell.classList.contains("found")) return;

        if (!started) {
          startTimer();
          revealAllCells();
        }

        if (value === next) {
          cell.classList.add("found");
          next += reverseOrderOn ? -1 : 1;
          if (reverseOrderOn ? next < 1 : next > size * size) {
            completeRound();
            return;
          }
          targetText.textContent = String(next);
          refreshHint();
          return;
        }

        errors += 1;
        errorText.textContent = String(errors);
        cell.classList.remove("wrong");
        void cell.offsetWidth;
        cell.classList.add("wrong");
        window.clearTimeout(cell._wrongTimer);
        cell._wrongTimer = window.setTimeout(() => {
          cell.classList.remove("wrong");
        }, 300);
      }

      function handleColorChoice(button, colorKey) {
        if (finished) return;
        if (!started) startTimer();

        if (currentStroopAnswerColor && colorKey === currentStroopAnswerColor.key) {
          button.classList.add("correct");
          window.setTimeout(() => button.classList.remove("correct"), 180);
          if (stroopTrial >= stroopTotal) {
            completeStroopRound();
            return;
          }
          stroopTrial += 1;
          nextStroopPrompt();
          return;
        }

        errors += 1;
        errorText.textContent = String(errors);
        button.classList.remove("wrong");
        void button.offsetWidth;
        button.classList.add("wrong");
        window.clearTimeout(button._wrongTimer);
        button._wrongTimer = window.setTimeout(() => {
          button.classList.remove("wrong");
        }, 300);
      }

      function handleDecodeChoice(button) {
        if (finished || decodeAnswered >= decodeQuestionsData.length) return;
        if (!started) startTimer();
        const item = decodeQuestions.querySelector(`.decode-question[data-index="${decodeAnswered}"]`);
        const question = decodeQuestionsData[decodeAnswered];
        const answer = decodeReverseOn ? question.symbol : question.letter;

        if (button.dataset.answer === answer) {
          item.classList.add("answered");
          decodeAnswered += 1;
          targetText.textContent = `${decodeAnswered}/${decodeTotal}`;
          refreshDecodeCursor();
          if (decodeAnswered >= decodeTotal) completeDecodeRound();
          return;
        }

        errors += 1;
        errorText.textContent = String(errors);
        button.classList.remove("wrong");
        void button.offsetWidth;
        button.classList.add("wrong");
        window.clearTimeout(button._wrongTimer);
        button._wrongTimer = window.setTimeout(() => {
          button.classList.remove("wrong");
        }, 300);
      }

      function handleIdiomCell(cell) {
        if (finished || cell.classList.contains("found")) return;

        if (!started) {
          startTimer();
          revealAllCells();
        }

        if (cell.dataset.target === "true" && Number(cell.dataset.order) === idiomNextIndex) {
          cell.classList.add("found");
          idiomNextIndex += 1;
          if (idiomNextIndex >= currentIdioms.length * 4) {
            completeIdiomRound();
            return;
          }
          currentIdiom = currentIdioms[Math.floor(idiomNextIndex / 4)];
          idiomText.textContent = currentIdiom;
          targetText.textContent = currentIdiom[idiomNextIndex % 4];
          return;
        }

        errors += 1;
        errorText.textContent = String(errors);
        cell.classList.remove("wrong");
        void cell.offsetWidth;
        cell.classList.add("wrong");
        window.clearTimeout(cell._wrongTimer);
        cell._wrongTimer = window.setTimeout(() => {
          cell.classList.remove("wrong");
        }, 300);
      }

      function handlePoemCell(cell) {
        if (finished || cell.classList.contains("found")) return;

        if (!started) {
          startTimer();
          revealAllCells();
        }

        if (cell.dataset.char === poemChars[poemNextIndex]) {
          cell.classList.add("found");
          poemNextIndex += 1;
          if (poemNextIndex >= poemChars.length) {
            completePoemRound();
            return;
          }
          targetText.textContent = poemChars[poemNextIndex];
          return;
        }

        errors += 1;
        errorText.textContent = String(errors);
        cell.classList.remove("wrong");
        void cell.offsetWidth;
        cell.classList.add("wrong");
        window.clearTimeout(cell._wrongTimer);
        cell._wrongTimer = window.setTimeout(() => {
          cell.classList.remove("wrong");
        }, 300);
      }

      function handleMemoryCell(cell, index) {
        if (!memoryActive || finished || memoryPreviewing || cell.classList.contains("memory-correct")) return;
        if (!started) startTimer();

        if (memoryRemaining.has(index)) {
          cell.classList.add("memory-correct");
          memoryRemaining.delete(index);
          if (memoryRemaining.size === 0) {
            if (memoryRound >= memoryTotalRounds) {
              completeMemoryRound();
              return;
            }
            memoryRound += 1;
            addMemoryTarget();
            memoryPreviewing = true;
            notice.textContent = "准备下一轮";
            window.clearTimeout(memoryPreviewTimer);
            memoryPreviewTimer = window.setTimeout(showMemoryPreview, 350);
          }
          return;
        }

        errors += 1;
        errorText.textContent = String(errors);
        cell.classList.remove("memory-wrong");
        void cell.offsetWidth;
        cell.classList.add("memory-wrong");
        window.clearTimeout(cell._wrongTimer);
        cell._wrongTimer = window.setTimeout(() => {
          cell.classList.remove("memory-wrong");
        }, 300);
      }

      function completeRound() {
        finished = true;
        stopTimer();
        elapsedMs = performance.now() - startStamp;
        timeText.textContent = formatSeconds(elapsedMs);
        targetText.textContent = "完成";

        const total = size * size;
        const record = {
          id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
          type: "schulte",
          size,
          reverse: reverseOrderOn,
          colorInterference: colorInterferenceOn,
          timeMs: Math.round(elapsedMs),
          errors,
          accuracy: Math.round((total / (total + errors)) * 1000) / 10,
          date: new Date().toISOString()
        };

        const previousBest = bestForSize(size);
        addRecord(record);
        showResult(record, !previousBest || record.timeMs < previousBest.timeMs);
      }

      function completeStroopRound() {
        finished = true;
        stopTimer();
        elapsedMs = performance.now() - startStamp;
        timeText.textContent = formatSeconds(elapsedMs);
        targetText.textContent = "完成";

        const record = {
          id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
          type: "stroop",
          trials: stroopTotal,
          textAnswer: stroopTextAnswerOn,
          timeMs: Math.round(elapsedMs),
          errors,
          accuracy: Math.round((stroopTotal / (stroopTotal + errors)) * 1000) / 10,
          date: new Date().toISOString()
        };

        const previousBest = bestForCurrentTraining();
        addRecord(record);
        showResult(record, !previousBest || record.timeMs < previousBest.timeMs);
      }

      function completeDecodeRound() {
        finished = true;
        stopTimer();
        elapsedMs = performance.now() - startStamp;
        timeText.textContent = formatSeconds(elapsedMs);
        targetText.textContent = "完成";

        const record = {
          id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
          type: "decode",
          trials: decodeTotal,
          reverse: decodeReverseOn,
          symbols: decodePairs.map((pair) => pair.symbol).join(""),
          timeMs: Math.round(elapsedMs),
          errors,
          accuracy: Math.round((decodeTotal / (decodeTotal + errors)) * 1000) / 10,
          date: new Date().toISOString()
        };

        const previousBest = bestForCurrentTraining();
        addRecord(record);
        showResult(record, !previousBest || record.timeMs < previousBest.timeMs);
      }

      function completeIdiomRound() {
        finished = true;
        stopTimer();
        elapsedMs = performance.now() - startStamp;
        timeText.textContent = formatSeconds(elapsedMs);
        targetText.textContent = "完成";

        const record = {
          id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
          type: "idiom",
          cols: idiomCols,
          rows: 4,
          colorInterference: colorInterferenceOn,
          idioms: currentIdioms,
          idiom: currentIdioms.join("、"),
          timeMs: Math.round(elapsedMs),
          errors,
          accuracy: Math.round(((idiomCols * 4) / (idiomCols * 4 + errors)) * 1000) / 10,
          date: new Date().toISOString()
        };

        const previousBest = bestForCurrentTraining();
        addRecord(record);
        showResult(record, !previousBest || record.timeMs < previousBest.timeMs);
      }

      function completePoemRound() {
        finished = true;
        stopTimer();
        elapsedMs = performance.now() - startStamp;
        timeText.textContent = formatSeconds(elapsedMs);
        targetText.textContent = "完成";

        const record = {
          id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
          type: "poem",
          title: currentPoem.title,
          dynasty: currentPoem.dynasty,
          author: currentPoem.author,
          colorInterference: colorInterferenceOn,
          chars: poemChars.length,
          timeMs: Math.round(elapsedMs),
          errors,
          accuracy: Math.round((poemChars.length / (poemChars.length + errors)) * 1000) / 10,
          date: new Date().toISOString()
        };

        const previousBest = bestForCurrentTraining();
        addRecord(record);
        showResult(record, !previousBest || record.timeMs < previousBest.timeMs);
      }

      function completeMemoryRound() {
        finished = true;
        memoryActive = false;
        memoryReplayButton.disabled = true;
        memoryStartButton.disabled = false;
        memoryStartButton.textContent = "开始记忆";
        stopTimer();
        elapsedMs = performance.now() - startStamp;
        timeText.textContent = formatSeconds(elapsedMs);
        targetText.textContent = "完成";
        notice.textContent = "";

        const correctClicks = (memoryTotalRounds * (memoryTotalRounds + 1)) / 2;
        const record = {
          id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
          type: "memory",
          rounds: memoryTotalRounds,
          grid: `${memorySize}×${memorySize}`,
          replays: memoryReplayCount,
          timeMs: Math.round(elapsedMs),
          errors,
          accuracy: Math.round((correctClicks / (correctClicks + errors)) * 1000) / 10,
          date: new Date().toISOString()
        };

        const previousBest = bestForCurrentTraining();
        addRecord(record);
        showResult(record, !previousBest || record.timeMs < previousBest.timeMs);
      }

      function completeMindfulnessRound(audioCompleted) {
        if (finished || currentTraining !== "mindfulness") return;
        if (timerId) elapsedMs = performance.now() - startStamp;
        if (elapsedMs <= 0) {
          notice.textContent = "请先播放引导音频";
          return;
        }
        const audio = selectedMindfulnessAudio();
        if (!audio) {
          notice.textContent = "请先选择引导音频";
          return;
        }
        finished = true;
        mindfulnessAudio.pause();
        stopTimer();
        elapsedMs = Math.round(elapsedMs);
        timeText.textContent = formatSeconds(elapsedMs);
        targetText.textContent = audioCompleted ? "完成" : "已结束";
        mindfulnessFinishButton.disabled = true;
        mindfulnessAudioSelect.disabled = false;
        const record = {
          id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
          type: "mindfulness",
          audioName: audio.name,
          audioCompleted: Boolean(audioCompleted),
          timeMs: elapsedMs,
          practiceMs: elapsedMs,
          date: new Date().toISOString()
        };
        addRecord(record);
        showResult(record, false);
      }

      function bestForSize(targetSize) {
        return records
          .filter((record) => recordMatchesTraining(record, "schulte") && record.size === targetSize && Boolean(record.reverse) === reverseOrderOn)
          .sort((a, b) => a.timeMs - b.timeMs)[0];
      }

      function recordMatchesTraining(record, training = currentTraining) {
        const type = record.type || "schulte";
        return type === training;
      }

      function recordsForCurrentTraining() {
        return records.filter((record) => {
          if (!recordMatchesTraining(record)) return false;
          if (currentTraining === "schulte") return record.size === size && Boolean(record.reverse) === reverseOrderOn;
          if (currentTraining === "idiom") return record.cols === idiomCols;
          return true;
        });
      }

      function bestForCurrentTraining() {
        return recordsForCurrentTraining().sort((a, b) => a.timeMs - b.timeMs)[0];
      }

      function refreshStats() {
        const current = recordsForCurrentTraining();
        if (currentTraining === "mindfulness") {
          const total = current.reduce((sum, record) => sum + recordPracticeMs(record), 0);
          countLabel.textContent = "练习次数";
          avgLabel.textContent = "累计时长";
          fastLabel.textContent = "平均时长";
          avgErrorLabel.textContent = "完整播放";
          countText.textContent = String(current.length);
          avgText.textContent = current.length ? formatPracticeDuration(total) : "--";
          fastText.textContent = current.length ? formatPracticeDuration(total / current.length) : "--";
          avgErrorText.textContent = String(current.filter((record) => record.audioCompleted).length);
          return;
        }
        const best = bestForCurrentTraining();
        countLabel.textContent = "练习次数";
        avgLabel.textContent = "平均用时";
        fastLabel.textContent = "最快用时";
        avgErrorLabel.textContent = "平均错误";
        countText.textContent = String(current.length);
        fastText.textContent = best ? `${formatSeconds(best.timeMs)}s` : "--";
        avgText.textContent = current.length
          ? `${formatSeconds(current.reduce((sum, record) => sum + record.timeMs, 0) / current.length)}s`
          : "--";
        avgErrorText.textContent = current.length
          ? (current.reduce((sum, record) => sum + record.errors, 0) / current.length).toFixed(1)
          : "--";
      }

      function refreshScorePanel() {
        refreshStats();
        renderFullRecords();
      }

      function refreshHint() {
        board.querySelectorAll(".next").forEach((cell) => cell.classList.remove("next"));
        if (!hintOn || finished) return;
        const target = board.querySelector(`[data-value="${next}"]`);
        if (target && !target.classList.contains("found")) target.classList.add("next");
      }

      function applyGridTextColors() {
        board.querySelectorAll(".cell").forEach((cell) => {
          const color = colorInterferenceOn
            ? schulteDigitColors[Math.floor(Math.random() * schulteDigitColors.length)]
            : "#101719";
          cell.style.setProperty("--digit-color", color);
        });
      }

      function createRecordNode(record) {
        const node = document.createElement("article");
        node.className = "record";
        const type = record.type || "schulte";
        const label = type === "stroop" ? "斯特鲁普" : type === "decode" ? "\u8bd1\u7801\u8bad\u7ec3" : type === "idiom" ? `4×${record.cols}` : type === "poem" ? "古诗训练" : type === "memory" ? "记忆训练" : type === "mindfulness" ? "正念练习" : `${record.size}×${record.size}${record.reverse ? " 倒序" : ""}`;
        const detail = type === "stroop"
          ? `${record.trials || stroopTotal}题· 错${record.errors}`
          : type === "decode"
            ? `${record.trials || decodeTotal}\u9898 \u00b7 \u9519 ${record.errors}`
          : type === "idiom"
            ? `${record.idioms?.length || record.cols || 1}个成绩· 错${record.errors}`
            : type === "poem"
              ? `${record.title || "古诗"} · ${record.chars || 0}字· 错${record.errors}`
              : type === "memory"
                ? `${record.rounds || memoryTotalRounds}轮· 错${record.errors}${Number(record.replays || 0) > 0 ? ` · 复现 ${Number(record.replays || 0)} 次` : ""}`
                : type === "mindfulness"
                  ? `${record.audioName || "引导音频"} · ${record.audioCompleted ? "完整播放" : "提前结束"}`
                : `错${record.errors}`;

        const modeDiv = document.createElement("div");
        modeDiv.className = "mode";
        modeDiv.textContent = label;

        const infoDiv = document.createElement("div");
        const strong = document.createElement("strong");
        strong.textContent = type === "mindfulness" ? (record.audioCompleted ? "完整" : "已结束") : `${record.accuracy}%`;
        const time = document.createElement("time");
        time.setAttribute("datetime", record.date || "");
        time.textContent = `${formatShortDate(record.date)} · ${detail}`;
        infoDiv.append(strong, time);

        const scoreDiv = document.createElement("div");
        scoreDiv.className = "score";
        scoreDiv.textContent = `${formatSeconds(record.timeMs)}s`;

        node.append(modeDiv, infoDiv, scoreDiv);
        return node;
      }

      function renderFullRecords() {
        const current = recordsForCurrentTraining();
        if (!current.length) {
          fullRecords.innerHTML = `<p class="empty">暂无成绩记录</p>`;
          return;
        }
        fullRecords.replaceChildren(...current.map(createRecordNode));
      }

      function showResult(record, isBest) {
        const type = record.type || "schulte";
        const label = type === "stroop" ? "斯特鲁普" : type === "decode" ? "\u8bd1\u7801\u8bad\u7ec3" : type === "idiom" ? `成语训练` : type === "poem" ? "古诗训练" : type === "memory" ? "记忆训练" : type === "mindfulness" ? "正念练习" : `${record.size}×${record.size}${record.reverse ? " 倒序" : ""}`;
        const unit = type === "decode" ? `${record.trials || decodeTotal}\u9898` : type === "stroop" ? `${record.trials || stroopTotal}题` : type === "idiom" ? `${record.idioms?.length || record.cols || 1}个成绩· 4×${record.cols}` : type === "poem" ? `${record.title || "古诗"} · ${record.chars || 0}字` : type === "memory" ? `${record.rounds || memoryTotalRounds}轮· ${record.grid || "5×5"}` : type === "mindfulness" ? record.audioName || "引导音频" : record.reverse ? "倒序方格" : "方格";

        resultSummary.replaceChildren();
        const items = type === "mindfulness" ? [
          ["模式", label],
          ["音频", unit],
          ["练习时长", formatPracticeDuration(recordPracticeMs(record))],
          ["完成方式", record.audioCompleted ? "完整播放" : "提前结束"],
          ["日期", formatShortDate(record.date)]
        ] : [
          ["模式", label],
          ["内容", unit],
          ["用时", `${formatSeconds(record.timeMs)}s`],
          ["错误", String(record.errors)],
          ["正确", `${record.accuracy}%`],
          ["日期", formatShortDate(record.date)]
        ];
        if (type === "memory" && Number(record.replays || 0) > 0) {
          items.push(["复现", String(Number(record.replays || 0))]);
        }
        items.forEach(([spanText, strongText]) => {
          const div = document.createElement("div");
          div.className = "summary-item";
          const span = document.createElement("span");
          span.textContent = spanText;
          const strong = document.createElement("strong");
          strong.textContent = strongText;
          div.append(span, strong);
          resultSummary.append(div);
        });

        notice.textContent = isBest ? "刷新最快成绩" : "";
        if (typeof resultDialog.showModal === "function") resultDialog.showModal();
      }

      function syncModeControls() {
        reverseOrderToggle.checked = reverseOrderOn;
        colorInterferenceToggle.checked = colorInterferenceOn;
        decodeReverseToggle.checked = decodeReverseOn;
        stroopTextAnswerToggle.checked = stroopTextAnswerOn;
        modeButtons.forEach((button) => {
          button.classList.toggle("active", Number(button.dataset.size) === size);
        });
        idiomModeButtons.forEach((button) => {
          button.classList.toggle("active", Number(button.dataset.idiomCols) === idiomCols);
        });
      }

      function activateTask(task) {
        if (!dailyTaskSpecs[task.module]) return;
        if (task.module === "schulte") {
          size = Number(taskModeSetting(task, "size")) || 5;
          reverseOrderOn = Boolean(taskModeSetting(task, "reverse"));
          colorInterferenceOn = Boolean(taskModeSetting(task, "colorInterference"));
        } else if (task.module === "stroop") {
          stroopTextAnswerOn = Boolean(taskModeSetting(task, "textAnswer"));
        } else if (task.module === "idiom") {
          idiomCols = Number(taskModeSetting(task, "cols")) || 4;
          colorInterferenceOn = Boolean(taskModeSetting(task, "colorInterference"));
        } else if (task.module === "poem") {
          colorInterferenceOn = Boolean(taskModeSetting(task, "colorInterference"));
        } else if (task.module === "decode") {
          decodeReverseOn = Boolean(taskModeSetting(task, "reverse"));
        }
        syncModeControls();
        setTraining(task.module);
      }

      function setTraining(training) {
        currentTraining = training;
        trainingButtons.forEach((button) => {
          button.classList.toggle("active", button.dataset.training === currentTraining);
        });
        if (resultDialog.open) resultDialog.close();
        buildBoard();
      }

      function setSize(nextSize) {
        size = nextSize;
        modeButtons.forEach((button) => {
          button.classList.toggle("active", Number(button.dataset.size) === size);
        });
        buildBoard();
      }

      function setIdiomCols(nextCols) {
        idiomCols = nextCols;
        idiomModeButtons.forEach((button) => {
          button.classList.toggle("active", Number(button.dataset.idiomCols) === idiomCols);
        });
        buildBoard();
      }

      trainingButtons.forEach((button) => {
        button.addEventListener("click", () => setTraining(button.dataset.training));
      });

      modeButtons.forEach((button) => {
        button.addEventListener("click", () => setSize(Number(button.dataset.size)));
      });

      idiomModeButtons.forEach((button) => {
        button.addEventListener("click", () => setIdiomCols(Number(button.dataset.idiomCols)));
      });

      document.getElementById("resetButton").addEventListener("click", buildBoard);
      memoryStartButton.addEventListener("click", startMemoryTraining);
      memoryReplayButton.addEventListener("click", replayMemoryPreview);
      mindfulnessAudioSelect.addEventListener("change", setMindfulnessAudioSource);
      mindfulnessAudio.addEventListener("play", () => {
        if (currentTraining !== "mindfulness") {
          mindfulnessAudio.pause();
          return;
        }
        if (finished) {
          mindfulnessAudio.pause();
          notice.textContent = "本次练习已记录，请重新开始。";
          return;
        }
        startTimer();
        mindfulnessAudioSelect.disabled = true;
        mindfulnessFinishButton.disabled = false;
        notice.textContent = "正在播放引导音频";
      });
      mindfulnessAudio.addEventListener("pause", () => {
        if (currentTraining === "mindfulness" && !finished && !mindfulnessAudio.ended && started) {
          pauseTimer();
          notice.textContent = "已暂停，继续播放后会继续计时。";
        }
      });
      mindfulnessAudio.addEventListener("ended", () => completeMindfulnessRound(true));
      mindfulnessFinishButton.addEventListener("click", () => completeMindfulnessRound(false));
      poemToggleButton.addEventListener("click", () => {
        const expanded = poemToggleButton.getAttribute("aria-expanded") === "true";
        poemToggleButton.setAttribute("aria-expanded", String(!expanded));
        poemToggleButton.textContent = expanded ? "显示全诗" : "隐藏全诗";
        poemFullText.classList.toggle("is-hidden", expanded);
      });
      document.getElementById("againButton").addEventListener("click", () => {
        resultDialog.close();
        buildBoard();
      });
      document.getElementById("recordsButton").addEventListener("click", () => {
        recordsNotice.textContent = "";
        refreshScorePanel();
        if (typeof recordsDialog.showModal === "function") recordsDialog.showModal();
      });
      document.getElementById("closeResultButton").addEventListener("click", () => resultDialog.close());
      document.getElementById("closeRecordsButton").addEventListener("click", () => recordsDialog.close());
      document.getElementById("closeRecordsBottomButton").addEventListener("click", () => recordsDialog.close());
      function clearRecords() {
        const current = recordsForCurrentTraining();
        if (!current.length) {
          refreshScorePanel();
          recordsNotice.textContent = "暂无可清空的成绩记录";
          return;
        }
        if (window.confirm("确定清空当前模式的所有成绩记录吗？")) {
          records = records.filter((record) => !current.includes(record));
          saveRecords();
          refreshScorePanel();
          notice.textContent = "成绩记录已清空";
          recordsNotice.textContent = "全部成绩记录已清空";
        }
      }

      document.getElementById("clearAllButton").addEventListener("click", clearRecords);
      sessionStartButton.style.display = "none";
      sessionStopButton.style.display = "none";
      sessionStartButton.addEventListener("click", startSessionTimer);
      sessionStopButton.addEventListener("click", stopSessionTimer);
      hintToggle.addEventListener("change", () => {
        hintOn = hintToggle.checked;
        refreshHint();
      });
      reverseOrderToggle.addEventListener("change", () => {
        reverseOrderOn = reverseOrderToggle.checked;
        if (currentTraining === "schulte") buildBoard();
      });
      colorInterferenceToggle.addEventListener("change", () => {
        colorInterferenceOn = colorInterferenceToggle.checked;
        if (currentTraining !== "stroop") applyGridTextColors();
      });
      decodeReverseToggle.addEventListener("change", () => {
        decodeReverseOn = decodeReverseToggle.checked;
        if (currentTraining === "decode") buildBoard();
      });
      stroopTextAnswerToggle.addEventListener("change", () => {
        stroopTextAnswerOn = stroopTextAnswerToggle.checked;
        if (currentTraining === "stroop") buildBoard();
      });
      function openUserCenter() {
        setNotice(userCenterNotice, "");
        loadUserCenter();
        if (typeof userCenterDialog.showModal === "function") userCenterDialog.showModal();
      }

      userCenterButton.addEventListener("click", openUserCenter);
      closeUserCenterButton.addEventListener("click", () => userCenterDialog.close());
      saveUserButton.addEventListener("click", saveUserProfile);
      registerUserButton.addEventListener("click", openRegisterDialog);
      logoutUserButton.addEventListener("click", () => {
        cloudUser = null;
        loadedUserIdentifier = "";
        loginPasswordInput.value = "";
        saveCloudUser();
        saveLoadedUserIdentifier();
        loadUserCenter();
        setNotice(userCenterNotice, "已登出");
      });
      loginUserButton.addEventListener("click", loadSyncedUserByIdentifier);
      closeRegisterButton.addEventListener("click", () => registerDialog.close());
      registerButton.addEventListener("click", registerUser);
      birthDateInput.addEventListener("change", () => {
        applyUserToForm(userPayloadFromForm());
        renderDailyScores();
      });
      taskModuleSelect.addEventListener("change", updateTaskConfigVisibility);
      taskSizeSelect.addEventListener("change", updateTaskConfigVisibility);
      taskReverseSelect.addEventListener("change", updateTaskConfigVisibility);
      taskColorSelect.addEventListener("change", updateTaskConfigVisibility);
      taskIdiomSelect.addEventListener("change", updateTaskConfigVisibility);
      taskStroopAnswerSelect.addEventListener("change", updateTaskConfigVisibility);
      taskDecodeReverseSelect.addEventListener("change", updateTaskConfigVisibility);
      addTaskButton.addEventListener("click", () => {
        dailyTasks.push(buildTaskFromControls());
        persistUserCenter();
      });
      refreshDailyScoresButton.addEventListener("click", renderDailyScores);
      closeAdminLoginButton.addEventListener("click", () => adminLoginDialog.close());
      closeAdminPanelButton.addEventListener("click", () => adminPanelDialog.close());
      appTitle.addEventListener("click", () => {
        window.clearTimeout(adminClickTimer);
        adminClickCount += 1;
        adminClickTimer = window.setTimeout(() => {
          adminClickCount = 0;
        }, 1200);
        if (adminClickCount >= 5) {
          adminClickCount = 0;
          setNotice(adminLoginNotice, "");
          adminPasswordInput.value = "";
          if (typeof adminLoginDialog.showModal === "function") adminLoginDialog.showModal();
        }
      });
      adminLoginButton.addEventListener("click", async () => {
        adminPassword = adminPasswordInput.value;
        if (!adminPassword) {
          setNotice(adminLoginNotice, "请输入管理密码", true);
          return;
        }
        setNotice(adminLoginNotice, "正在验证...");
        try {
          const res = await apiJson("/api/admin/verify", {
            method: "POST",
            body: JSON.stringify({ password: adminPassword })
          });
          if (!res.ok) throw new Error(res.error || "管理密码不正确");
          adminLoginDialog.close();
          setNotice(adminPanelNotice, "");
          adminUserPreview.innerHTML = "";
          if (typeof adminPanelDialog.showModal === "function") adminPanelDialog.showModal();
          loadAdminUsers();
          loadAdminSettings();
          loadAdminAudioGuides();
        } catch (e) {
          setNotice(adminLoginNotice, e.message || "管理密码不正确", true);
        }
      });
      adminIdentifierInput.addEventListener("change", adminLookup);

      adminResetPasswordButton.addEventListener("click", adminResetPassword);
      adminDeleteButton.addEventListener("click", adminDeleteUser);
      adminSaveSettingsButton.addEventListener("click", saveAdminSettings);
      adminSaveTrainingNavigationButton.addEventListener("click", saveAdminTrainingNavigation);
      adminAudioFileInput.addEventListener("change", () => {
        const file = adminAudioFileInput.files && adminAudioFileInput.files[0];
        if (file && !adminAudioNameInput.value.trim()) adminAudioNameInput.value = file.name.replace(/\.mp3$/i, "");
      });
      adminUploadAudioButton.addEventListener("click", adminUploadAudio);
      loadSettings();
      renderTitleTasks();
      updateTaskConfigVisibility();
      loadUserCenter();
      loadPoems();
      loadMindfulnessAudios();
      buildBoard();
    })();
  </script>
</body>
</html>
