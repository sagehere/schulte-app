<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>理解练习 · 一步一步想明白</title><link rel="stylesheet" href="/assets/app.css"><link rel="stylesheet" href="/assets/learning.css"><body class="learning-page"><main class="app">
<header class="topbar"><a href="/">← 返回训练首页</a><a href="/parents">家长报告与观察</a><span id="identity"></span></header>
<h1>一步一步想明白</h1><p>读一读，找依据，说清关系。原文可以随时回看。</p>
<nav id="modules" aria-label="训练模块"></nav><p id="notice" role="status"></p>
<section id="catalog" hidden><p id="profileNotice" role="status"></p>
<section id="aiPanel" class="panel"><h2>为我准备新材料</h2><p id="aiStatus"></p><p class="muted">根据当前账号年龄与所选层次生成，内容通过格式、算式校验和模型复核后开始。若有疑问可由家长反馈。</p><button type="button" id="generate" class="tool-button primary" disabled>生成适合我的练习</button><p id="generationNotice" role="status"></p></section>
<div class="toolbar" id="learningModes" aria-label="练习方式">
<button type="button" data-phase="train">学习练习</button><button type="button" data-phase="check">独立检查</button><button type="button" data-phase="review">到期复习</button>
</div><p id="modeHint"></p>
<div class="toolbar"><label>内容层次 <select id="levelFilter"><option value="">全部层次</option><option value="1">基础</option><option value="2">连接</option><option value="3">迁移</option></select></label><label>想练习的技能 <select id="skillFilter"><option value="">全部技能</option></select></label></div>
<button type="button" id="manualReview" hidden>自主选择复习材料</button>
<div id="recommendation" class="card"></div>
<details><summary>查看技能记录与建议依据</summary><p>按技能分别观察。进阶参考最近8道未见题、至少2个日期、包含独立检查，首次独立正确率与独立检查正确率均达到80%。数据不足时继续观察；重复题不增加新题证据。</p><div id="skills"></div></details>
<div class="toolbar"><h2 id="unitListTitle">选择一个小练习</h2><button id="export">导出学习记录</button></div><div id="units" class="cards"></div><h2>最近练习与技能记录</h2><div id="history"></div></section>
<section id="practice" hidden><button id="back">保存并返回列表</button><h2 id="title"></h2><p id="progress"></p><details open><summary>阅读材料 · 随时回看</summary><div id="passage"></div></details>
<button id="demo" type="button">方法示范（记为获得帮助）</button><p><a id="feedbackLink" href="/parents" target="_blank" rel="noopener">这一步有疑问</a>（由家长填写）</p>
<p id="feedback" role="status"></p><h3 id="question"></h3><div id="options"></div><form id="answerForm"><label id="answerLabel">我的算式或答案<input id="answer" maxlength="200" autocomplete="off"></label><button id="submit">提交答案</button></form><div id="hints"></div><button type="button" id="skipCheck" hidden>这步暂时不会，先提交</button><div class="toolbar" id="help"><button id="hint">给我一点提示</button><button id="reveal">看讲解，继续学习</button></div></section>
</main><script src="/assets/learning.js" defer></script></body></html>
